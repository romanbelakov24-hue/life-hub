<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>life hub</title>
    <!--
      Локальная заглушка мобильной обёртки.

      Приложение открывает живой сайт (см. server.url в capacitor.config.ts).
      Эта страница показывается, только если сайт не открылся: без неё WebView
      отдал бы системную страницу ошибки на английском с адресом и кодом.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --paper: #fbf9f5;
        --ink: #17140f;
        --ink-muted: #5f584c;
        --accent: #bf3d18;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0d0c0b;
          --ink: #f6f2ea;
          --ink-muted: #a49b8d;
          --accent: #ff6438;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px 24px calc(32px + env(safe-area-inset-bottom, 0px));
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }

      .mark {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .mark span {
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }

      p {
        margin: 0;
        max-width: 300px;
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink-muted);
      }

      button {
        margin-top: 4px;
        padding: 12px 22px;
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="mark">life <span>hub</span></div>
    <h1>Нет связи с сервером</h1>
    <p>
      Приложение не смогло открыть сайт. Проверьте интернет и попробуйте ещё раз.
    </p>
    <button type="button" onclick="location.reload()">Повторить</button>
  </body>
</html>
